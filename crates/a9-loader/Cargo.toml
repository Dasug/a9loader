[package]
name = "a9-loader"
description = "A-Train 9 v5 mod loader — the version.dll proxy product (M0: parity port of the C reference)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# lib name "version" so the cdylib artifact is version.dll — the proxy file name
# the game must load. rlib is included so `cargo test` links cleanly.
name = "version"
crate-type = ["cdylib", "rlib"]

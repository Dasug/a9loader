[package]
name = "a9ml"
description = "A-Train 9 mod loader — authoring & diagnostics CLI"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
a9-formats = { path = "../a9-formats" }
a9-mod = { path = "../a9-mod" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
semver = { version = "1", features = ["serde"] }
toml = "0.9"

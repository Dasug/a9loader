# a9loader build address book — one entry per supported game build.
# Anchors are named; mod manifests reference anchor names, never raw RVAs
# (a raw rva target is the diagnostic escape hatch and must carry its own
# `expect` bytes). `expect` values are the ORIGINAL bytes at the anchor,
# verified in the mapped image before any write — a game update that shifts
# code fails loudly instead of corrupting memory. These per-anchor checks
# are the in-image build fingerprint; the build id itself comes from the
# exe file's VERSIONINFO (parsed from bytes, never via the version.dll APIs
# our proxy forwards).
#
# Provenance: international Steam ATrain9v5.exe, FILEVERSION 5,0,0,5634
# (build id "5.00.5634"), extracted 2026-10-15 from the live install.
# RVAs are in-image; file offsets noted in comments (.text/.rdata map
# file = rva - 0xC00; per-section mapping via the PE section table).

[build."5.00.5634".anchors.train_list_filter]
rva = 0x1A13B0              # FUN_1401a13b0 (file 0x1a07b0)
expect = "48,89,5c,24,08,48,89,74,24,18,48,89,7c,24,20,48"

[build."5.00.5634".anchors.train_list_whitelist]
rva = 0x6FC1C0              # 97-entry u32 table (file 0x6fb5c0)
expect = "5f,00,00,00"        # entry 0 fingerprint

[build."5.00.5634".anchors.cfile_open]
rva = 0x41D40C              # MFC CFile::Open — the ONE file-open funnel (file 0x41c80c)
expect = "40,53,55,56,57,41,56,41,57,48,81,ec,88,02,00,00"

[build."5.00.5634".anchors.form_list]
rva = 0x6FC430              # UTF-16 comma-separated FORM names (file 0x6fb830)
expect = "46,00,4f,00,52,00,4d,00,5f,00,32,00,30,00,31,00"        # head fingerprint

# ---- M4 runtime fetch probe (notes/24 round 3: the material fetch classes
# pass ctx opaquely through vtable dispatch, so which pack object serves
# which composed key is only answerable at runtime; these four anchors are
# hooked trampoline-only when a9loader.toml sets probe_fetch = true).
# Expect bytes verbatim from the international Steam build (read from the
# exe bytes, per-instruction boundaries machine-verified with objdump):
# each record ends at the first instruction boundary >= 16 (the hook write
# is 16 bytes and the trampoline re-enters at entry + record length).
[build."5.00.5634".anchors.pack_fetch]
rva = 0x306E20              # FUN_140306e20 CPackFileBuffer::fetch (file 0x306220)
expect = "40,55,53,56,57,41,56,48,8d,ac,24,00,f8,ff,ff,48,81,ec,00,09,00,00"
# boundary = 22: 5 pushes (7 B) + lea rbp,[rsp-0x800] (8 B) + sub rsp,0x900 (7 B);
# the quoted 16 bytes would re-enter at the second byte of `sub` (mid-instruction).

[build."5.00.5634".anchors.texture_fetch]
rva = 0x3010D0              # FUN_1403010d0 texture_fetch_miss_path (file 0x3004d0)
expect = "40,55,53,56,57,41,54,41,56,41,57,48,8d,ac,24,20,e0,ff,ff"
# boundary = 19: 7 pushes (11 B) + lea rbp,[rsp-0x1fe0] (8 B); the chkstk alloca
# (mov eax,0x20e0; call __chkstk; sub rsp,rax) follows, not part of the record.

[build."5.00.5634".anchors.ccommon_fetch]
rva = 0x2EC0E0              # FUN_1402ec0e0 CCommonShader::fetch (file 0x2eb4e0)
expect = "40,55,53,56,41,54,41,55,41,56,41,57,48,8d,ac,24,50,e8,ff,ff"
# boundary = 20: 7 pushes (12 B) + lea rbp,[rsp-0x17b0] (8 B); chkstk 0x18b0 next.

[build."5.00.5634".anchors.fetch_cache_get]
rva = 0x3089B0              # FUN_1403089b0 global fetch-cache get (file 0x307db0)
expect = "48,8b,c4,57,41,54,41,55,41,56,41,57,48,83,ec,40"
# boundary = 16: mov rax,rsp (3 B) + 5 pushes (9 B) + sub rsp,0x40 (4 B).

# ---- M4 inject-mode splice (notes/24 R5 + seams.md; machine-verified bytes
# from the international Steam exe): the family-B loader's pool-runner call,
# the one seam where decoded entry content can be extended per pack window.
# VA 0x1403f0259/file 0x3ef659: `E8 62 02 C6 FF` = call FUN_1400504c0 (the
# worker-row-pool runner), reached after the loader's row-fill (lea rcx,[
# 0x140f02470] at 0x1403f0252 = RCX = &pool). The two bytes that follow —
# `85 db` = test ebx,ebx at 0x1403f025E, with the je that closes the loader's
# retry loop — are a READ-ONLY fingerprint: the splice rewrites ONLY the
# 5 E8 bytes (the rel32 points at the injector stub; the caller's live EBX,
# RSI, RBP, R12B/R13D sit across the call and are preserved by ABI).
[build."5.00.5634".anchors.famb_runner_call]
rva = 0x3F0259              # pool-runner call in pack_loader_image_generic (file 0x3ef659)
expect = "e8,62,02,c6,ff,85,db"

# The relay CAVE for the famb splice: a compiler alignment pad (a real inter-
# function CC run, preceded by `41 5e 41 5d 41 5c 5f c3` = pops/ret — notes/
# 24 round 6). 14-byte FF 25 + imm64 relay lands inside these 21 CC bytes.
[build."5.00.5634".anchors.famb_runner_cave]
rva = 0x59A071              # see note above; longest CC run in .text (21 bytes)
expect = "cc,cc,cc,cc,cc,cc,cc,cc,cc,cc,cc,cc,cc,cc,cc,cc"

# ---- M5 family-A tailgate (in-place decode append). The game LZSS-decodes
# every family-A pack through ONE funnel, `pack_lzss_decode` 0x140314bf0
# (entry from the international Steam exe). Every family-A loader the loader
# can host an [[asset]] in reaches it through a single 5-byte E8:
#   vp    pack_loader_vp 0x1403f1210        site 0x1403f1434
#   tp    pack_loader_tp 0x1403f0d20        site 0x1403f0f4d
#   mcp   pack_loader_mcp 0x1403ee710       site 0x1403ee93a
#   ep    pack_loader_ep 0x1403ef9f0         site 0x1403efc16
#   cp    pack_loader_cp 0x1403ef100         site 0x1403ef326
#   i.dat pack_idat_loader 0x140314fa0       site 0x14031516f
# The splice rewrites each site's E8 rel32 to the relay cave below (exactly
# like M4's famb splice); the cave's `FF 25` + imm64 jumps into version.dll.
# All these sites call the same decode function, so the stub dispatches on the
# caller's continuation (site+5): 0x1403f1439 / 0x1403f0f52 / 0x1403ee93f /
# 0x1403efc1b / 0x1403ef32b / 0x140315174.
[build."5.00.5634".anchors.pack_lzss_decode]
rva = 0x314BF0              # pack_lzss_decode entry (file 0x313ff0)
expect = "41,54,41,56,41,57,b8,60,10,00,00"

[build."5.00.5634".anchors.pack_lzss_vp_call]
rva = 0x3F1434              # vp's CALL pack_lzss_decode (file 0x3f0834)
expect = "e8,b7,37,f2,ff"

[build."5.00.5634".anchors.pack_lzss_tp_call]
rva = 0x3F0F4D              # tp's CALL pack_lzss_decode (file 0x3f034d)
expect = "e8,9e,3c,f2,ff"

[build."5.00.5634".anchors.pack_lzss_idat_call]
rva = 0x31516F              # i.dat's CALL pack_lzss_decode (file 0x31456f)
expect = "e8,7c,fa,ff,ff"

[build."5.00.5634".anchors.pack_lzss_mcp_call]
rva = 0x3EE93A              # mcp's CALL pack_lzss_decode (file 0x3edd3a)
expect = "e8,b1,62,f2,ff"

[build."5.00.5634".anchors.pack_lzss_ep_call]
rva = 0x3EFC16              # ep's CALL pack_lzss_decode (file 0x3ef016)
expect = "e8,d5,4f,f2,ff"

[build."5.00.5634".anchors.pack_lzss_cp_call]
rva = 0x3EF326              # cp's CALL pack_lzss_decode (file 0x3ee726)
expect = "e8,c5,58,f2,ff"

# The tailgate relay cave: a real inter-function CC pad preceded by the
# `41 5f 41 5e 41 5d 41 5c 5f c3` (pop r15/r14/r13/r12/rdi; ret) epilogue,
# 19 CC bytes long — the 14-byte FF 25 + imm64 relay lands well inside. Chosen
# fresh in .text (the M4 famb cave 0x59a071 is already consumed by the
# injector and lives in a different CC run).
[build."5.00.5634".anchors.pack_lzss_cave]
rva = 0x5A1D13              # 19-byte CC run in .text (file 0x5a1113)
expect = "cc,cc,cc,cc,cc,cc,cc,cc,cc,cc,cc,cc,cc,cc,cc,cc"

# ---------------------------------------------------------------------------
# M5-T — the family-A decode WORKSPACE (the 200 MB out buffer).
#
# `boot_pack_system_driver` 0x140319480 allocates the shared workspace ONCE at
# boot (stage 1), before any pack decode:
#   0x1403197cd  CALL pack_workspace_accessor      ; RAX = &DAT_144f86088
#   0x1403197dc  MOV  [RAX+0x10], 0xC800000        ; out cap (200 MB)
#   0x1403197e3  MOV  [RAX+0x14], 0x9600000        ; in cap (150 MB, never read)
#   0x1403197ed  CALL _aligned_malloc(0xC800000,0x10)  ; -> DAT_144f86088 (out)
#   0x140319808  CALL _aligned_malloc(0x9600000,0x10)  ; -> DAT_144f86090 (in)
#   0x14031981a  CALL pack_master_map_access       ; <- the swap hook: both
#                                                   buffers exist and are non-NULL
# Consumers re-read the global at every use (no caching), and the teardown
# frees both pointers with `_aligned_free` under a NULL guard, so a swap is
# transparent — provided the new buffers come from the game's own
# `_aligned_malloc` and the out CAP is raised too (it is the decoder's bound).
# The in cap is never read (zero refs) and the tailgate never touches the
# encoded file, so M5-T only swaps the OUT buffer.
[build."5.00.5634".anchors.workspace_alloc]
rva = 0x3197CD              # CALL pack_workspace_accessor (file 0x318bcd)
expect = "e8,8e,d4,fe,ff"

[build."5.00.5634".anchors.workspace_alloc_tail]
rva = 0x31981A              # CALL pack_master_map_access — the swap site (file 0x318c1a)
expect = "e8,01,b7,ff,ff"

[build."5.00.5634".anchors.workspace_alloc_callee]
rva = 0x314F20              # pack_master_map_access — the site's pinned target (file 0x314320)
expect = "48,83,ec,38,48,c7,44,24,20,fe,ff,ff,ff,8b,05,bd"

# The workspace singleton (zero-initialized .data/bss — no expect bytes; the
# stub verifies the shipped caps at +0x10/+0x14 at runtime instead).
[build."5.00.5634".anchors.workspace_globals]
rva = 0x4F86088              # +0 out ptr, +8 in ptr, +0x10 out cap, +0x14 in cap

[build."5.00.5634".anchors.aligned_malloc]
rva = 0x597BA8              # _aligned_malloc(size, align) (file 0x596fa8)
expect = "40,53,48,83,ec,20,48,8d,42,ff,48,85,c2,74,14,e8"

[build."5.00.5634".anchors.aligned_free]
rva = 0x597B8C              # _aligned_free(ptr) (file 0x596f8c)
expect = "48,83,ec,28,48,85,c9,74,0d,48,83,e1,f8,48,8b,49"

# The M5-T relay cave: a 19-byte CC run in .text (preceded by `33 c0 eb c4`),
# fresh — the M4 famb cave 0x59a071 and the M5 tailgate cave 0x5a1d13 are both
# consumed already.
[build."5.00.5634".anchors.workspace_cave]
rva = 0x592363              # 19-byte CC run in .text (file 0x591763)
expect = "cc,cc,cc,cc,cc,cc,cc,cc,cc,cc,cc,cc,cc,cc,cc,cc"

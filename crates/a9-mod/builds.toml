# ---------------------------------------------------------------------------
# M7-0 — the SAVE-ID CLAMP GUARD (always on; a safety fix, not a diagnostic).
#
# A saved formation's form id is used as a spec-row index with NO bounds check
# (corpus notes/62 §5), so an id past the vector's length (DAT_140e14528,
# stride 0x140) reads past the heap block — a garbage train, or a crash for
# larger ids. This is reachable today whenever a save is loaded without the mod
# that made it, and becomes routine once M7 admits mod trains past row 421.
#
# Two choke points cover every saved id that reaches the spec table:
#
#  1. the GROUP HEAD — the u32 id in `save_train_group_restore` 0x1401b6d10,
#     after the legacy remap (sub==0x16) and immediately before the row test:
#       1401b6f0c: 49 63 c6              movsxd rax,r14d
#       1401b6f0f: 48 8d 0c 80           lea    rcx,[rax+rax*4]
#       1401b6f13: 48 c1 e1 06           shl    rcx,0x6
#       1401b6f17: 48 8b 05 .. .. .. ..  mov    rax,[0x140e14528]
#       1401b6f1e: 80 3c 01 00           cmp    byte [rcx+rax],0     ; row[0] bValid
#       1401b6f22: 0f 85 .. .. .. ..     jne    0x1401b7050          ; NORMAL path
#       1401b6f28: 80 bc 01 9e 00 00 00 02   cmp byte [rcx+rax+0x9e],2
#       1401b6f30: 0f 84 .. .. .. ..     je     0x1401b7050          ; NORMAL path
#       1401b6f36: 48 8b 8c 01 38 01 00  mov rcx,[rcx+rax+0x138]     ; BLANK path
#     The 7 bytes at 0x1401b6f0c (movsxd+lea) are rewritten to
#     `E8 rel32; 90 90` — a `call` to the relay cave below; a naked shim in
#     version.dll clamps r14d, reproduces the two overwritten instructions and
#     `ret`s to 0x1401b6f11 (the 2 nops) → 0x1401b6f13. RSP ≡ 0 (mod 16) at the
#     site (8 pushes + sub rsp,0x118), so the shim sees the ABI's RSP ≡ 8.
#     An out-of-range head id becomes 417 — the engine's own auto-named invalid
#     row (`form_id_417`, built by train_list_builder's tail 0x14019d2dd):
#     bValid==0, bSpecialFlag==0 and a valid pFormName, so the BLANK path runs
#     and clones that name (a zero-filled row would crash there, notes/62 §1.4).
#     417 is never a CSV row and never a mod slot, so it can never be repurposed.
#
#  2. the PER-CAR ids — the fixed 0xf8 car block `FUN_140061ee0` bulk-reads into
#     the consist object at 0x140061f8b (`call mmf_paged_read 0x140308f20`, the
#     destination `lea rdx,[rbp+0x2c]` = consist+0x50c). Every per-car u16 id
#     (10 rows, stride 0x18) comes from that block, so clamping the block right
#     after the read covers `train_row_car_wiring` 0x1401ab990 (reads
#     `PTR_140e14528[id].aModelIdx[aux-1]`), `custom_dat_parser` 0x140061260
#     (its `0x1a0 < id` gate short-circuits bValid but the block still reads

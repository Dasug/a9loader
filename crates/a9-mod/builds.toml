# ---------------------------------------------------------------------------
# M7-1 — DIRECT SPEC-ROW INJECTION (the mechanism; NOT wired into the boot
# engine — M7-2 does that). Harness-driven through the `a9loader_m7_rows`
# export; the fake manager/spec-table pages live in harness/host.c.
#
# The route (PLAN §M7): leave the FORM name literal and the boot-time matcher
# alone; grow the spec vector AFTER `spec_table_resize` has re-pinned it, and
# write extra rows cloned from a shipped template row. Four anchors:
#
#  * `spec_table_resize` 0x14019f150 — `std::vector<A9_SpecRow_140>::resize(421)`.
#    Its body pins the vector to EXACTLY 421 (`mov ebx,0x1a5`), so a growth done
#    before it is silently undone. The mechanism hooks it (trampoline-only) and
#    injects AFTER the original returns, which is what makes the ordering safe.
#    ABI: rcx = &vec (the vector object = manager+0x18 = 0x140e14528).
#    Prologue 19 B: 2 home stores + push rdi + sub rsp,0x30 + mov r8,[rcx+8]
#    (all position-independent: RSP-relative + register-relative).
#
#  * `spec_table_realloc` 0x14019fc50 — `(rcx = &vec, rdx = new_total_rows)`.
#    Allocates a new block with the GAME's allocator (0x14040a838), copies the
#    existing rows into it, destroys + frees the old block (0x14040a884), and
#    sets cap = new_total, end = old_count, begin = new block. This is exactly
#    the "grow the vector with the game's allocator so its teardown frees it
#    cleanly" primitive (the M5-T lesson) — the vector destructor then frees the
#    block with the same allocator family. Prologue 20 B: push r14 + sub rsp,0x40
#    + a 9-B home store + mov [rsp+0x50],rbx.
#
#  * `spec_table_row_accessor` 0x1401aacb0 — `(rcx = &vec, rdx = id) -> row*`
#    = `*(vec) + id*0x140` (pure index math, NO bounds check; 62 callers). The
#    mechanism resolves every row address through it (so the id→row contract is
#    the engine's own). Whole function is 12 B: lea/shl/add/ret.
#
#  * `row_name_ctor` 0x1400372f0 — the engine's own formatted-name constructor,
#    the one `train_list_builder`'s tail uses to auto-name rows 417-420
#    (`&row->pFormName, L"form_id_%d", id` at 0x14019d312). ABI:
#    `(rcx = dest string field, rdx = wide format, r8 = arg)` — variadic, one
#    integer arg. Used to build the injected row's unique `pFormName` and its
#    JP/EN display lanes as VALID A9_RcStr blocks (refcount header at data-0x18;
#    a zero-filled reserved row crashes `save_train_group_restore`'s blank path).
#    Prologue 19 B: 3 home stores + sub rsp,0x28.
#
# Row stride is 0x140; ids are u16 in the save, so the reserved range must stay
# ≤ 65535, and (M7-1 choice) under forms.rs `FORMS_MAX` = 1024 so the composed
# keep-set can still admit the loader's own trains.
[build."5.00.5634".anchors.spec_table_resize]
rva = 0x19F150              # std::vector<A9_SpecRow_140>::resize(421) (file 0x19e550)
expect = "48,89,5c,24,08,48,89,74,24,10,57,48,83,ec,30,4c,8b,41,08"

[build."5.00.5634".anchors.spec_table_realloc]
rva = 0x19FC50              # the vector's reallocate (game allocator) (file 0x19f050)
expect = "41,56,48,83,ec,40,48,c7,44,24,30,fe,ff,ff,ff,48,89,5c,24,50"

[build."5.00.5634".anchors.spec_table_row_accessor]
rva = 0x1AACB0              # vec.begin + id*0x140 (no bounds check) (file 0x1aa0b0)
expect = "48,8d,04,92,48,c1,e0,06,48,03,01,c3"

[build."5.00.5634".anchors.row_name_ctor]
rva = 0x372F0               # the builder's auto-name ctor (file 0x366f0)
expect = "48,89,54,24,10,4c,89,44,24,18,4c,89,4c,24,20,48,83,ec,28"

# ---------------------------------------------------------------------------
# M7-2 — the `[[train]]` section. The train compiler expands into the existing
# primitives (row merges, asset entries) plus a direct spec-row injection. The
# injection site is NOT M7-1's `spec_table_resize`:
#
#   `train_csv_pipeline_builder` 0x14019c340 calls `spec_table_resize` at
#   0x14019c89e and then IMMEDIATELY runs its fill loop (0x14019c8c0..0x14019d2cf)
#   — so right after the resize the rows are still uninitialised, and M7-1's
#   clone-a-shipped-row step would copy garbage. The purchase-list builder,
#   however, is called from INSIDE the same pipeline at 0x14019d606 (after the
#   fill loop and the `form_id_%d` auto-name tail), so hooking it and injecting
#   BEFORE its original runs is the first point where a shipped row is fully
#   populated. The original then walks the grown vector through the loader's
#   composed keep-set, so the injected rows are admitted.
#
#  * `train_list_builder` 0x14019d9c0 — walks the spec vector (manager+0x18/
#    +0x20), applies the purchase filter (0x1401a13b0, which the loader
#    replaces), and builds the offered list. Prologue 17 B, position-independent
#    (3 pushes + sub rsp,0x20 + mov rax,[rcx+0x30] + mov [rsp+0x48],rbp — the
#    record ends at the first instruction boundary >= 16: the home store is 5 B,
#    so 16 would cut it mid-instruction), so it hooks through the standard
#    trampoline. Sole caller 0x14019d606 (the pipeline) + 0x1402c9de5 (the window
#    rebuild); the hook injects once, on the first call where the vector is
#    exactly 421 rows and the donor row is valid.
#
#  * `wstr_clone_ref` 0x14001d7d0 — `(rcx = dest name field, rdx = src name
#    field)`: clones an A9_RcStr field (a refcount bump / COW) so an injected
#    row's name pointers are OWNED by the row. The M7-1 clone shares the
#    template's other name pointers without a refcount increment, so the live
#    teardown would double-free them; the train injection clones every one of
#    the 18 lanes (awName[0..8] @+0xa8, awNameAlt[0..8] @+0xf0) through this.
#    Prologue 16 B, position-independent; it is CALLED, never hooked.
[build."5.00.5634".anchors.train_list_builder]
